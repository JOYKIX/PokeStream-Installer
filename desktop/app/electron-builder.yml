appId: app.pokestream.desktop
productName: PokeStream
directories:
  app: .artifacts/shell
  output: .artifacts/release
files:
  - '*.cjs'
  - package.json
  - update-key.json
  - '!**/node_modules/**/*'
npmRebuild: false
extraResources:
  - from: .artifacts/runtime/launcher
    to: launcher
win:
  target:
    - target: portable
      arch: [x64]
  icon: desktop/connect/src/Connect.Desktop/Assets/connect.ico
  signExecutable: false
portable:
  artifactName: PokeStream-${version}-win-x64.exe
  requestExecutionLevel: user
publish:
  provider: github
  owner: JOYKIX
  repo: PokeStream-Installer
  releaseType: release
