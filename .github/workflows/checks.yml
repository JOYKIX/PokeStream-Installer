name: PokeStream — Quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Validate Electron and build scripts
        run: |
          node --check desktop/app/main.cjs
          node --check desktop/app/preload.cjs
          node --check desktop/app/updater.cjs
          node --check scripts/build-desktop.mjs
      - run: npm run build
