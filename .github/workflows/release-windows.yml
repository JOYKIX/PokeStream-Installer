name: PokeStream — Windows Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-windows.yml'
      - 'src/**'
      - 'scripts/**'
      - 'desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - 'RELEASE-NOTES.md'
permissions:
  contents: write
concurrency:
  group: pokestream-release
  cancel-in-progress: true
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: desktop/connect/data/sprites.zip
          key: connect-sprites-${{ hashFiles('desktop/connect/data/sprite-manifest.json') }}
      - name: Validate TypeScript and launcher syntax
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'TypeScript failed' }
          Get-ChildItem desktop/app -Filter '*.cjs' | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw 'Launcher syntax failed' } }
          node --check desktop/app/launcher.js
          node --check scripts/build-desktop.mjs
      - name: Windows maintenance integration smoke tests
        run: node --test scripts/maintenance.test.cjs
      - name: Build local application and custom launcher
        run: npm run desktop:pack
      - name: Prepare stable download and SHA256 checksums
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $dir = '.artifacts/release'
          $launcher = Join-Path $dir "PokeStream-$version-win-x64.exe"
          if (!(Test-Path -LiteralPath $launcher)) { throw 'Custom launcher missing' }
          Copy-Item -LiteralPath $launcher -Destination (Join-Path $dir 'PokeStream-Setup.exe')
          Copy-Item desktop/connect/dist/*-source.zip -Destination $dir
          $files = @(Get-ChildItem $dir -File | Where-Object { $_.Extension -in '.exe','.zip' })
          $lines = foreach ($file in $files) {
            $algorithm = [Security.Cryptography.SHA256]::Create()
            $stream = [IO.File]::OpenRead($file.FullName)
            try { $hash = [BitConverter]::ToString($algorithm.ComputeHash($stream)).Replace('-', '').ToLowerInvariant() }
            finally { $stream.Dispose(); $algorithm.Dispose() }
            "$hash  $($file.Name)"
          }
          $lines | Set-Content (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
      - name: Publish public release
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag exists. Bump package version." }
          $assets = @(Get-ChildItem -File '.artifacts/release' | Where-Object { $_.Extension -in '.exe','.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName })
          gh release create $tag @assets --title "PokeStream $version" --notes-file RELEASE-NOTES.md --target "$env:GITHUB_SHA" --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: PokeStream-Release-Diagnostics
          path: .artifacts/release/*
          if-no-files-found: ignore
