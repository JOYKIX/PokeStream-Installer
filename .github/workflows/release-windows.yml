name: PokeStream — Windows build
on:
  push:
    branches: [prepare-app-3.0.3-launcher-1.1.2-i18n]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: npm ci
      - name: Validate native Connect compilation
        shell: pwsh
        run: |
          # The runtime sprite archive is generated separately during publication.
          # An empty embedded resource validates XAML/C# compilation without downloading game artwork.
          $resource = 'desktop/connect/data/sprites.zip'
          if (Test-Path $resource) { throw 'Unexpected pre-existing sprite archive.' }
          [System.IO.File]::WriteAllBytes((Join-Path $PWD $resource), [byte[]]@())
          try {
            dotnet build desktop/connect/src/Connect.Desktop/Connect.Desktop.csproj --configuration Release
            if ($LASTEXITCODE -ne 0) { throw 'Native Connect compilation failed.' }
          }
          finally {
            Remove-Item -LiteralPath $resource -Force -ErrorAction SilentlyContinue
          }
      - name: Build authenticated distribution
        env:
          POKESTREAM_SIGNING_KEY: ${{ secrets.POKESTREAM_SIGNING_KEY }}
        shell: pwsh
        run: |
          if (!$env:POKESTREAM_SIGNING_KEY) { throw 'Configure the publisher signing secret first.' }
          npm run desktop:pack
      - uses: actions/upload-artifact@v4
        with:
          name: PokeStream-Windows
          path: .artifacts/release/*
          if-no-files-found: error
