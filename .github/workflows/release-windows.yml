name: PokeStream — Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: npm ci
      - name: Build authenticated distribution
        env:
          POKESTREAM_SIGNING_KEY: ${{ secrets.POKESTREAM_SIGNING_KEY }}
        shell: pwsh
        run: |
          if (!$env:POKESTREAM_SIGNING_KEY) { throw 'Configure the publisher signing secret first.' }
          npm run desktop:pack
      - uses: actions/upload-artifact@v4
        with:
          name: PokeStream-Windows
          path: .artifacts/release/*
          if-no-files-found: error
