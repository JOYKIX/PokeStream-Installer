name: PokeStream — Source checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Electron and build script syntax
        run: |
          node --check desktop/app/main.cjs
          node --check desktop/app/preload.cjs
          node --check desktop/app/updater.cjs
          node --check scripts/build-desktop.mjs
      - name: Next.js production build
        run: npm run build
        env:
          POKESTREAM_LOCAL: '1'
          NODE_ENV: production
